<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>筑灵 · Tulpa Studio — 创造与记录你的心智伙伴</title>
<meta name="description" content="一站式 tulpa 创造工具：性格与角色设计、新手教程、每日练习、日志记录与里程碑追踪。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>✦</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
/* 内联打包：css/style.css */
/* ============================================================
   筑灵 · Tulpa Studio — 设计系统
   主题：星尘 · 深空极光 + 玻璃拟态
   ============================================================ */

:root {
  --bg: #070b16;
  --bg2: #0c1122;
  --panel: rgba(255, 255, 255, 0.045);
  --panel-strong: rgba(20, 27, 51, 0.72);
  --line: rgba(255, 255, 255, 0.09);
  --line-strong: rgba(255, 255, 255, 0.16);
  --txt: #eaeef9;
  --muted: #98a2c2;
  --faint: #6b7494;

  --violet: #a78bfa;
  --violet-deep: #7c5cf0;
  --cyan: #3fe0f0;
  --pink: #f472b6;
  --gold: #fbbf24;
  --green: #34d399;
  --red: #f87171;

  --grad: linear-gradient(135deg, #a78bfa 0%, #5ec8f0 55%, #3fe0f0 100%);
  --grad-soft: linear-gradient(135deg, rgba(167, 139, 250, 0.18), rgba(63, 224, 240, 0.12));

  --serif: 'Noto Serif SC', 'Songti SC', 'STSong', 'SimSun', serif;
  --sans: 'Noto Sans SC', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif;

  --r-lg: 20px;
  --r-md: 14px;
  --r-sm: 10px;
  --shadow: 0 10px 40px rgba(3, 6, 18, 0.55);
  --shadow-glow: 0 0 0 1px rgba(167, 139, 250, 0.25), 0 12px 44px rgba(90, 60, 200, 0.35);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

/* 确保 hidden 属性始终生效（不被 display 规则覆盖） */
[hidden] { display: none !important; }

html { scroll-behavior: smooth; }

body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--txt);
  line-height: 1.7;
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

::selection { background: rgba(167, 139, 250, 0.4); }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.12); border-radius: 8px; border: 2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background: rgba(167, 139, 250, 0.4); }

:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; border-radius: 4px; }

/* ---------------- 背景 ---------------- */
.bg {
  position: fixed; inset: 0; z-index: -2;
  background:
    radial-gradient(1200px 800px at 80% -10%, rgba(124, 92, 240, 0.16), transparent 60%),
    radial-gradient(1000px 700px at -10% 30%, rgba(63, 224, 240, 0.10), transparent 60%),
    radial-gradient(900px 700px at 50% 120%, rgba(244, 114, 182, 0.08), transparent 60%),
    linear-gradient(180deg, #070b16 0%, #0a0f20 55%, #080c19 100%);
}

.aurora {
  position: absolute; border-radius: 50%;
  filter: blur(90px); opacity: 0.5;
  will-change: transform;
  animation: drift 26s ease-in-out infinite alternate;
}
.aurora-1 { width: 46vw; height: 46vw; top: -14vw; left: -10vw;
  background: radial-gradient(circle, rgba(124, 92, 240, 0.5), transparent 70%); }
.aurora-2 { width: 40vw; height: 40vw; top: 8vh; right: -12vw;
  background: radial-gradient(circle, rgba(63, 224, 240, 0.35), transparent 70%);
  animation-delay: -9s; animation-duration: 32s; }
.aurora-3 { width: 34vw; height: 34vw; bottom: -12vw; left: 24vw;
  background: radial-gradient(circle, rgba(244, 114, 182, 0.28), transparent 70%);
  animation-delay: -17s; animation-duration: 38s; }

@keyframes drift {
  0%   { transform: translate(0, 0) scale(1); }
  50%  { transform: translate(4vw, 3vh) scale(1.12); }
  100% { transform: translate(-3vw, -2vh) scale(0.95); }
}

.stars i {
  position: absolute; border-radius: 50%;
  background: #fff;
  animation: twinkle 5s ease-in-out infinite alternate;
}
@keyframes twinkle {
  0% { opacity: 0.15; transform: scale(0.8); }
  100% { opacity: 1; transform: scale(1.15); }
}

.vignette {
  position: absolute; inset: 0;
  background: radial-gradient(120% 100% at 50% 40%, transparent 55%, rgba(3, 5, 12, 0.55) 100%);
}

/* ---------------- 顶栏 ---------------- */
.topbar {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; gap: 28px;
  padding: 14px clamp(18px, 4vw, 40px);
  background: rgba(7, 11, 22, 0.62);
  backdrop-filter: blur(18px) saturate(1.4);
  -webkit-backdrop-filter: blur(18px) saturate(1.4);
  border-bottom: 1px solid var(--line);
}

.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--txt); }
.brand-mark {
  width: 38px; height: 38px; display: grid; place-items: center;
  font-size: 20px; color: #fff; border-radius: 12px;
  background: var(--grad);
  box-shadow: 0 4px 18px rgba(124, 92, 240, 0.55);
  animation: markPulse 5s ease-in-out infinite;
}
@keyframes markPulse {
  0%, 100% { box-shadow: 0 4px 18px rgba(124, 92, 240, 0.55); }
  50% { box-shadow: 0 4px 26px rgba(63, 224, 240, 0.6); }
}
.brand-text { display: flex; flex-direction: column; line-height: 1.15; font-family: var(--serif); font-weight: 700; font-size: 19px; letter-spacing: 2px; }
.brand-text em { font-style: normal; font-family: var(--sans); font-size: 10px; font-weight: 500; letter-spacing: 3px; color: var(--faint); text-transform: uppercase; }

.nav { display: flex; gap: 4px; margin-left: auto; }
.nav a {
  padding: 8px 16px; border-radius: 999px; text-decoration: none;
  color: var(--muted); font-size: 14px; font-weight: 500;
  transition: all 0.25s ease; border: 1px solid transparent;
}
.nav a:hover { color: var(--txt); background: rgba(255, 255, 255, 0.06); }
.nav a.active {
  color: #fff; background: var(--grad-soft);
  border-color: rgba(167, 139, 250, 0.35);
  box-shadow: inset 0 0 18px rgba(167, 139, 250, 0.12);
}

.nav-toggle {
  display: none; margin-left: auto;
  background: none; border: 1px solid var(--line); border-radius: 10px;
  width: 40px; height: 40px; cursor: pointer; flex-direction: column;
  align-items: center; justify-content: center; gap: 4px;
}
.nav-toggle span { width: 18px; height: 2px; background: var(--txt); border-radius: 2px; transition: 0.3s; }

/* ---------------- 主区 ---------------- */
.main {
  max-width: 1160px; margin: 0 auto;
  padding: 36px clamp(18px, 4vw, 40px) 80px;
}

.view { display: none; animation: viewIn 0.45s ease; }
.view.active { display: block; }
@keyframes viewIn {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: none; }
}

.view-head { margin-bottom: 26px; }
.view-title {
  font-family: var(--serif); font-weight: 900; font-size: clamp(26px, 4vw, 34px);
  letter-spacing: 3px;
  background: linear-gradient(120deg, #fff, #c8d2ff);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}
.view-sub { color: var(--muted); margin-top: 4px; font-size: 14px; letter-spacing: 1px; }

/* ---------------- 卡片 ---------------- */
.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 22px;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  box-shadow: var(--shadow);
  transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
}
.card:hover { border-color: var(--line-strong); }

.card-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; margin-bottom: 16px;
}
.card-head h3 { font-size: 16px; font-weight: 700; letter-spacing: 1px; }

.muted { color: var(--muted); font-size: 13.5px; }
.hint { margin-top: 12px; }
.accent { color: var(--violet); font-weight: 700; }

.pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 12px; border-radius: 999px;
  font-size: 12px; font-weight: 600; letter-spacing: 0.5px;
  background: rgba(167, 139, 250, 0.14); color: #cdbcfc;
  border: 1px solid rgba(167, 139, 250, 0.3); white-space: nowrap;
}
.pill.st-done { background: rgba(52, 211, 153, 0.13); color: #7ce8c0; border-color: rgba(52, 211, 153, 0.32); }
.pill.st-doing { background: rgba(251, 191, 36, 0.12); color: #fcd98a; border-color: rgba(251, 191, 36, 0.3); }
.pill.st-not { background: rgba(255, 255, 255, 0.06); color: var(--faint); border-color: var(--line); }

/* ---------------- 按钮 ---------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 9px 20px; border-radius: 12px;
  font-family: var(--sans); font-size: 14px; font-weight: 600; letter-spacing: 1px;
  border: 1px solid var(--line-strong);
  background: rgba(255, 255, 255, 0.07); color: var(--txt);
  cursor: pointer; text-decoration: none;
  transition: all 0.22s ease;
}
.btn:hover { transform: translateY(-1px); background: rgba(255, 255, 255, 0.11); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

.btn.primary {
  background: var(--grad); color: #08101f; border: none;
  box-shadow: 0 6px 22px rgba(94, 168, 240, 0.4);
}
.btn.primary:hover { box-shadow: 0 8px 30px rgba(94, 168, 240, 0.55); }
.btn.ghost { background: transparent; border-color: var(--line); color: var(--muted); }
.btn.ghost:hover { color: var(--txt); border-color: var(--line-strong); background: rgba(255,255,255,0.05); }
.btn.danger { background: rgba(248, 113, 113, 0.16); border-color: rgba(248, 113, 113, 0.4); color: #fca5a5; }
.btn.danger-ghost { background: transparent; border-color: rgba(248, 113, 113, 0.3); color: #fca5a5; }
.btn.danger-ghost:hover { background: rgba(248, 113, 113, 0.1); }
.btn.big { padding: 13px 30px; font-size: 15px; border-radius: 14px; }
.btn.full { width: 100%; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.btn-row.center { justify-content: center; }

.iconbtn {
  width: 34px; height: 34px; display: grid; place-items: center;
  border-radius: 10px; border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.04); color: var(--muted);
  cursor: pointer; font-size: 14px; transition: all 0.2s ease;
}
.iconbtn:hover { color: var(--txt); border-color: var(--line-strong); background: rgba(255,255,255,0.08); }
.iconbtn.del:hover { color: var(--red); border-color: rgba(248, 113, 113, 0.4); }

/* ---------------- Hero ---------------- */
.hero {
  position: relative; overflow: hidden;
  display: flex; align-items: center; gap: 26px;
  padding: clamp(26px, 4.5vw, 46px);
  margin-bottom: 26px;
  border-radius: 26px;
  background:
    linear-gradient(140deg, rgba(124, 92, 240, 0.16), rgba(63, 224, 240, 0.07) 55%, rgba(244, 114, 182, 0.1)),
    var(--panel);
  border: 1px solid rgba(167, 139, 250, 0.22);
  backdrop-filter: blur(20px);
  box-shadow: var(--shadow-glow);
}
.hero-orb {
  flex: none; width: 84px; height: 84px; border-radius: 28px;
  display: grid; place-items: center;
  font-family: var(--serif); font-size: 34px; font-weight: 900; color: #fff;
  background: var(--grad);
  box-shadow: 0 10px 34px rgba(124, 92, 240, 0.5), inset 0 1px 0 rgba(255,255,255,0.4);
  animation: floaty 6s ease-in-out infinite;
}
@keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
.hero-text h2 { font-family: var(--serif); font-size: clamp(21px, 3vw, 27px); letter-spacing: 2px; margin-bottom: 6px; }
.hero-text p { color: var(--muted); font-size: 14.5px; max-width: 560px; }

.welcome-hero { flex-direction: column; text-align: center; align-items: center; }
.welcome-hero h2 { font-size: clamp(24px, 4vw, 34px); margin: 8px 0 10px; letter-spacing: 4px; }
.welcome-hero p { max-width: 620px; margin-bottom: 18px; }

.steps { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; margin-bottom: 22px; }
.step {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 18px; border-radius: 999px;
  background: rgba(255, 255, 255, 0.05); border: 1px solid var(--line);
  font-size: 13.5px; color: var(--muted);
}
.step span {
  width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
  font-size: 12px; font-weight: 700; color: #08101f; background: var(--grad);
}

/* ---------------- 网格 ---------------- */
.grid { display: grid; gap: 18px; }
.stats-grid { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin-bottom: 18px; }
.stat { text-align: center; padding: 18px 12px; }
.stat-icon { display: block; font-size: 22px; margin-bottom: 8px; }
.stat-num { display: block; font-family: var(--serif); font-size: 24px; font-weight: 900; letter-spacing: 1px; }
.stat-label { display: block; color: var(--faint); font-size: 12.5px; margin-top: 2px; letter-spacing: 1px; }

.dash-cols { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.journal-cols { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }

/* ---------------- 进度条 / 阶段 ---------------- */
.progressbar {
  height: 8px; border-radius: 999px; overflow: hidden;
  background: rgba(255, 255, 255, 0.07); margin: 10px 0;
}
.progressbar-fill {
  height: 100%; border-radius: 999px;
  background: var(--grad);
  box-shadow: 0 0 14px rgba(124, 92, 240, 0.6);
  transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1);
}
.stage-track { display: flex; gap: 6px; margin: 12px 0 4px; }
.stage-dot {
  flex: 1; height: 6px; border-radius: 999px;
  background: rgba(255, 255, 255, 0.08);
  transition: all 0.4s ease;
}
.stage-dot.on { background: var(--grad); box-shadow: 0 0 10px rgba(124, 92, 240, 0.7); }

/* ---------------- 习惯打卡 ---------------- */
.habits { display: flex; flex-direction: column; gap: 10px; }
.habit {
  display: flex; align-items: center; gap: 14px; width: 100%;
  padding: 12px 14px; border-radius: var(--r-md);
  background: rgba(255, 255, 255, 0.035);
  border: 1px solid var(--line);
  color: var(--txt); cursor: pointer; text-align: left;
  font-family: var(--sans); transition: all 0.22s ease;
}
.habit:hover { background: rgba(255, 255, 255, 0.07); }
.habit.on { border-color: rgba(52, 211, 153, 0.4); background: rgba(52, 211, 153, 0.08); }
.habit-icon { font-size: 20px; }
.habit-body { flex: 1; display: flex; flex-direction: column; line-height: 1.35; }
.habit-label { font-size: 14px; font-weight: 600; }
.habit-hint { font-size: 12px; color: var(--faint); }
.habit-check {
  width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
  font-size: 13px; color: transparent;
  border: 2px solid var(--line-strong); transition: all 0.2s ease;
}
.habit.on .habit-check { color: #08101f; border-color: var(--green); background: var(--green); box-shadow: 0 0 12px rgba(52, 211, 153, 0.5); }

/* ---------------- 快捷操作 ---------------- */
.quick-actions { display: flex; flex-direction: column; gap: 10px; }
.qa {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; border-radius: var(--r-md);
  background: rgba(255, 255, 255, 0.035);
  border: 1px solid var(--line);
  color: var(--txt); text-decoration: none; cursor: pointer;
  font-family: var(--sans); font-size: 14px; font-weight: 500;
  transition: all 0.22s ease;
}
.qa span { font-size: 18px; }
.qa:hover { transform: translateX(4px); border-color: rgba(167, 139, 250, 0.4); background: rgba(167, 139, 250, 0.08); }

.tip-card .tip-text {
  font-family: var(--serif); font-size: 17px; line-height: 2;
  color: #d9def5; min-height: 60px;
  border-left: 3px solid var(--violet); padding-left: 16px;
}

/* ---------------- 设计工作室 ---------------- */
.studio-head { display: flex; align-items: center; gap: 18px; margin-bottom: 18px; }
.avatar {
  flex: none; width: 62px; height: 62px; border-radius: 20px;
  display: grid; place-items: center;
  font-family: var(--serif); font-size: 26px; font-weight: 900;
  background: rgba(255, 255, 255, 0.06); border: 1px dashed var(--line-strong);
  color: var(--faint);
}
.avatar.has {
  background: var(--grad); color: #08101f; border: none;
  box-shadow: 0 6px 22px rgba(124, 92, 240, 0.45);
}
.studio-head-text { flex: 1; min-width: 0; }
.studio-head-text h2 { font-family: var(--serif); font-size: 21px; letter-spacing: 2px; }
.save-hint {
  font-size: 12px; color: var(--green); opacity: 0; transition: opacity 0.3s ease;
}
.save-hint.show { opacity: 1; }

.studio-tabs {
  display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px;
}
.stab {
  padding: 9px 18px; border-radius: 12px;
  background: rgba(255, 255, 255, 0.04); border: 1px solid var(--line);
  color: var(--muted); cursor: pointer; font-family: var(--sans);
  font-size: 13.5px; font-weight: 600; letter-spacing: 1px;
  transition: all 0.22s ease;
}
.stab:hover { color: var(--txt); }
.stab.active {
  color: #fff; background: var(--grad-soft);
  border-color: rgba(167, 139, 250, 0.45);
  box-shadow: 0 0 18px rgba(124, 92, 240, 0.2);
}

.studio-panel { padding: 26px; }

.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; }
.field { display: flex; flex-direction: column; gap: 7px; }
.field.full { grid-column: 1 / -1; }
.field label { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: 1px; }
.field input, .field textarea, .field select,
.journal-form input, .journal-form textarea, .journal-form select,
.modal input, .modal textarea,
.drill textarea {
  font-family: var(--sans); font-size: 14px; color: var(--txt);
  background: rgba(5, 9, 20, 0.5);
  border: 1px solid var(--line);
  border-radius: 12px; padding: 11px 14px;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
  width: 100%;
}
.field textarea, .journal-form textarea, .modal textarea, .drill textarea { resize: vertical; min-height: 70px; }
.field input:focus, .field textarea:focus, .field select:focus,
.journal-form input:focus, .journal-form textarea:focus, .journal-form select:focus,
.modal input:focus, .modal textarea:focus,
.drill textarea:focus {
  outline: none; border-color: var(--violet);
  box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.18);
}
.field select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 20px) 50%, calc(100% - 15px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
.field input::placeholder, .field textarea::placeholder, .journal-form input::placeholder, .journal-form textarea::placeholder, .modal input::placeholder, .modal textarea::placeholder, .drill textarea::placeholder { color: var(--faint); }

.panel-tip {
  margin-top: 20px; padding: 13px 16px; border-radius: var(--r-md);
  background: var(--grad-soft); border: 1px solid rgba(167, 139, 250, 0.25);
  font-size: 13.5px; color: #c9d2ef;
}

/* ---------------- 特质选择 ---------------- */
.traits-head { display: flex; flex-direction: column; gap: 14px; margin-bottom: 18px; }
.filter-chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  padding: 6px 14px; border-radius: 999px;
  background: rgba(255, 255, 255, 0.05); border: 1px solid var(--line);
  color: var(--muted); cursor: pointer; font-family: var(--sans);
  font-size: 12.5px; font-weight: 600; letter-spacing: 0.5px;
  transition: all 0.2s ease;
}
.chip:hover { color: var(--txt); }
.chip.on {
  color: #fff; background: var(--grad-soft);
  border-color: rgba(167, 139, 250, 0.5);
}

.trait-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.trait {
  display: flex; flex-direction: column; gap: 4px; text-align: left;
  padding: 15px; border-radius: var(--r-md);
  background: rgba(255, 255, 255, 0.035);
  border: 1px solid var(--line);
  color: var(--txt); cursor: pointer; font-family: var(--sans);
  transition: all 0.2s ease; position: relative; overflow: hidden;
}
.trait:hover { transform: translateY(-2px); border-color: var(--line-strong); background: rgba(255, 255, 255, 0.07); }
.trait-emoji { font-size: 22px; }
.trait-name { font-size: 14.5px; font-weight: 700; letter-spacing: 1px; }
.trait-desc { font-size: 12px; color: var(--faint); line-height: 1.5; }
.trait-check { margin-top: 6px; font-size: 11.5px; color: var(--violet); font-weight: 600; }
.trait.on {
  border-color: rgba(167, 139, 250, 0.55);
  background: linear-gradient(150deg, rgba(167, 139, 250, 0.16), rgba(63, 224, 240, 0.08));
  box-shadow: 0 0 18px rgba(124, 92, 240, 0.18);
}
.trait.on .trait-check { color: var(--green); }
.trait.custom { border-style: dashed; }

.add-trait { align-items: flex-start; justify-content: center; border-style: dashed; }
.add-trait input {
  font-family: var(--sans); font-size: 13px; width: 100%;
  background: transparent; border: none; outline: none; color: var(--txt);
}
.add-trait input::placeholder { color: var(--faint); }

/* ---------------- 教程 ---------------- */
.guide-tabs {
  display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px;
}
.gtab {
  padding: 9px 20px; border-radius: 12px;
  background: rgba(255, 255, 255, 0.04); border: 1px solid var(--line);
  color: var(--muted); cursor: pointer; font-family: var(--sans);
  font-size: 14px; font-weight: 600; letter-spacing: 1px;
  transition: all 0.22s ease;
}
.gtab:hover { color: var(--txt); }
.gtab.active { color: #fff; background: var(--grad-soft); border-color: rgba(167, 139, 250, 0.45); box-shadow: 0 0 18px rgba(124, 92, 240, 0.2); }

.guide-layout { display: grid; grid-template-columns: 250px 1fr; gap: 18px; align-items: start; }
.lesson-list { position: sticky; top: 84px; display: flex; flex-direction: column; gap: 6px; }
.lesson-list h4 { font-size: 13px; color: var(--faint); letter-spacing: 2px; margin-bottom: 8px; }
.lesson-item {
  display: flex; align-items: center; gap: 12px; width: 100%;
  padding: 10px 12px; border-radius: 12px; text-align: left;
  background: transparent; border: 1px solid transparent;
  color: var(--muted); cursor: pointer; font-family: var(--sans);
  font-size: 13.5px; font-weight: 500; transition: all 0.2s ease;
}
.lesson-item:hover { background: rgba(255, 255, 255, 0.05); color: var(--txt); }
.lesson-item.on {
  background: var(--grad-soft); border-color: rgba(167, 139, 250, 0.4);
  color: #fff;
}
.lesson-num {
  flex: none; width: 28px; height: 28px; border-radius: 9px;
  display: grid; place-items: center; font-size: 13px; font-weight: 700;
  background: rgba(255, 255, 255, 0.07); color: var(--faint);
}
.lesson-item.on .lesson-num { background: var(--grad); color: #08101f; }

.lesson-body { padding: 30px; }
.lesson-head { margin-bottom: 22px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
.lesson-head h2 { font-family: var(--serif); font-size: 24px; letter-spacing: 2px; margin: 10px 0 6px; }
.lesson-h {
  font-family: var(--serif); font-size: 18px; letter-spacing: 1px;
  margin: 26px 0 10px; color: #dfe4f8;
  display: flex; align-items: center; gap: 10px;
}
.lesson-h::before { content: ''; width: 4px; height: 18px; border-radius: 4px; background: var(--grad); }
.lesson-p { font-size: 14.5px; color: #c3cae4; }
.lesson-list-ul { list-style: none; display: flex; flex-direction: column; gap: 8px; margin: 12px 0; }
.lesson-list-ul li {
  position: relative; padding-left: 26px; font-size: 14.5px; color: #c3cae4;
}
.lesson-list-ul li::before {
  content: '✦'; position: absolute; left: 4px; top: 0;
  color: var(--violet); font-size: 13px;
}
.lesson-nav { display: flex; align-items: center; justify-content: space-between; margin-top: 30px; padding-top: 18px; border-top: 1px solid var(--line); }

/* ---------------- 术语 / FAQ / 误区 ---------------- */
.glossary { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.gloss-item { padding: 14px 16px; border-radius: var(--r-md); background: rgba(255, 255, 255, 0.03); border: 1px solid var(--line); }
.gloss-term { font-weight: 700; font-size: 14.5px; letter-spacing: 1px; }
.gloss-term em { display: inline-block; margin-left: 8px; font-style: normal; font-size: 11px; color: var(--violet); background: rgba(167,139,250,0.12); padding: 1px 8px; border-radius: 999px; }
.gloss-item p { font-size: 13px; color: var(--muted); margin-top: 4px; }

.faq { display: flex; flex-direction: column; gap: 10px; }
.faq-item { border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; background: rgba(255,255,255,0.03); }
.faq-item summary {
  padding: 14px 18px; cursor: pointer; font-weight: 600; font-size: 14.5px;
  list-style: none; position: relative; padding-right: 44px; transition: color 0.2s;
  display: flex; align-items: center; gap: 10px;
}
.faq-item summary::before { content: '❓'; font-size: 15px; }
.faq-item summary::after {
  content: '+'; position: absolute; right: 18px; font-size: 20px; color: var(--violet);
  transition: transform 0.25s ease;
}
.faq-item[open] summary::after { transform: rotate(45deg); }
.faq-item summary:hover { color: #fff; }
.faq-item p { padding: 0 18px 16px 44px; font-size: 14px; color: var(--muted); }

.mistake-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
.mistake-card { padding: 18px; border-radius: var(--r-md); background: rgba(255,255,255,0.03); border: 1px solid var(--line); }
.mistake-card h4 { font-size: 15px; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
.mistake-card h4::before { content: '⚠️'; font-size: 15px; }
.mistake-card .fix { font-size: 13.5px; color: #9fe8c8; margin-top: 8px; }

/* ---------------- 记录日志 ---------------- */
.timer-card { text-align: center; padding: 12px 0; }
.timer-display {
  font-family: var(--serif); font-size: 52px; font-weight: 900; letter-spacing: 4px;
  background: linear-gradient(120deg, #fff, #b7c3ff);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  line-height: 1.2; font-variant-numeric: tabular-nums;
}
.timer-sub { margin: 4px 0 14px; }

.journal-form { display: flex; flex-direction: column; gap: 12px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.empty {
  text-align: center; padding: 44px 20px; color: var(--faint);
  border: 1px dashed var(--line); border-radius: var(--r-md);
  font-size: 14px;
}

.timeline { display: flex; flex-direction: column; gap: 4px; }
.journal-item {
  display: grid; grid-template-columns: 150px 1fr 36px; gap: 14px; align-items: start;
  padding: 14px 6px; border-bottom: 1px solid var(--line);
  transition: background 0.2s ease;
}
.journal-item:hover { background: rgba(255, 255, 255, 0.03); border-radius: var(--r-md); }
.j-date { display: flex; align-items: center; gap: 8px; color: var(--faint); font-size: 12.5px; }
.j-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); flex: none; }
.k-session .j-dot { background: var(--cyan); box-shadow: 0 0 8px rgba(63,224,240,0.7); }
.k-note .j-dot { background: var(--violet); box-shadow: 0 0 8px rgba(167,139,250,0.7); }
.k-milestone .j-dot { background: var(--gold); box-shadow: 0 0 8px rgba(251,191,36,0.7); }
.j-body { min-width: 0; }
.j-title { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 14.5px; }
.j-kind {
  font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 999px;
  background: rgba(255,255,255,0.07); color: var(--muted); flex: none;
}
.k-session .j-kind { color: var(--cyan); background: rgba(63,224,240,0.1); }
.k-note .j-kind { color: var(--violet); background: rgba(167,139,250,0.12); }
.k-milestone .j-kind { color: var(--gold); background: rgba(251,191,36,0.1); }
.j-body p { font-size: 13.5px; color: var(--muted); margin-top: 4px; white-space: pre-wrap; }

/* ---------------- 里程碑 ---------------- */
.m-overview { display: flex; align-items: center; gap: 26px; margin-bottom: 18px; flex-wrap: wrap; }
.ring {
  flex: none; width: 108px; height: 108px; border-radius: 50%;
  display: grid; place-items: center; position: relative;
  background: conic-gradient(var(--violet) calc(var(--p) * 1%), rgba(255,255,255,0.08) 0);
  box-shadow: 0 0 30px rgba(124, 92, 240, 0.3);
}
.ring::before {
  content: ''; position: absolute; inset: 10px; border-radius: 50%;
  background: var(--bg2);
}
.ring span {
  position: relative; font-family: var(--serif); font-size: 22px; font-weight: 900;
  background: linear-gradient(120deg, #fff, #b7c3ff);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}
.m-overview-text { flex: 1; min-width: 240px; }
.m-overview-text h3 { font-size: 18px; letter-spacing: 1px; }

.milestone-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
.milestone { display: flex; flex-direction: column; gap: 12px; }
.milestone.done { border-color: rgba(52, 211, 153, 0.3); }
.m-head { display: flex; gap: 14px; align-items: flex-start; }
.m-emoji { flex: none; font-size: 26px; width: 48px; height: 48px; display: grid; place-items: center; border-radius: 14px; background: rgba(255,255,255,0.05); border: 1px solid var(--line); }
.m-head h4 { font-size: 16px; letter-spacing: 1px; }
.m-head p { font-size: 12.5px; margin-top: 2px; }
.m-status { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.ms-btn {
  padding: 7px 4px; border-radius: 10px; text-align: center;
  background: rgba(255,255,255,0.04); border: 1px solid var(--line);
  color: var(--faint); cursor: pointer; font-family: var(--sans);
  font-size: 12.5px; font-weight: 600; transition: all 0.2s ease;
}
.ms-btn:hover { color: var(--txt); }
.milestone.not_started .ms-btn[data-status="not_started"],
.ms-btn.on { background: var(--grad-soft); border-color: rgba(167,139,250,0.5); color: #fff; }
.milestone.doing .ms-btn[data-status="doing"] { background: rgba(251,191,36,0.15); border-color: rgba(251,191,36,0.5); color: #fcd98a; }
.milestone.done .ms-btn[data-status="done"] { background: rgba(52,211,153,0.15); border-color: rgba(52,211,153,0.5); color: #7ce8c0; }
.m-tip { font-size: 12.5px; color: #aab4d8; background: rgba(255,255,255,0.03); border: 1px dashed var(--line); border-radius: 10px; padding: 9px 12px; }
.m-note {
  font-family: var(--sans); font-size: 13px; color: var(--txt);
  background: rgba(5,9,20,0.5); border: 1px solid var(--line);
  border-radius: 10px; padding: 9px 12px; resize: vertical;
}
.m-note:focus { outline: none; border-color: var(--violet); }
.m-date { font-size: 12px; color: var(--green); }

/* ---------------- 资源 ---------------- */
.res-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-bottom: 18px; }
.res-card { display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: var(--txt); position: relative; overflow: hidden; }
.res-card::after {
  content: ''; position: absolute; inset: 0; opacity: 0;
  background: linear-gradient(140deg, rgba(167,139,250,0.12), rgba(63,224,240,0.06));
  transition: opacity 0.3s ease; pointer-events: none;
}
.res-card:hover { transform: translateY(-3px); }
.res-card:hover::after { opacity: 1; }
.res-tag {
  align-self: flex-start; font-size: 11.5px; font-weight: 600;
  padding: 3px 11px; border-radius: 999px;
  background: rgba(167,139,250,0.13); color: #cdbcfc;
  border: 1px solid rgba(167,139,250,0.3);
}
.res-card h3 { font-size: 17px; letter-spacing: 1px; }
.res-card p { font-size: 13px; color: var(--muted); }
.res-link { margin-top: auto; font-size: 12.5px; color: var(--cyan); font-weight: 600; }
.disclaimer ul { list-style: none; display: flex; flex-direction: column; gap: 8px; }
.disclaimer li { font-size: 13.5px; color: var(--muted); padding-left: 24px; position: relative; }
.disclaimer li::before { content: '✦'; position: absolute; left: 4px; color: var(--violet); font-size: 12px; top: 2px; }

/* ---------------- 形象图片 ---------------- */
.hero-orb.img { overflow: hidden; padding: 0; border-radius: 26px; }
.hero-orb.img img { width: 100%; height: 100%; object-fit: cover; display: block; }

.avatar.img { overflow: hidden; padding: 0; border: none; }
.avatar.img img { width: 100%; height: 100%; object-fit: cover; display: block; }

.form-card .form-show { display: flex; gap: 18px; align-items: flex-start; }
.form-img {
  flex: none; width: 150px; height: 170px; border-radius: var(--r-md);
  overflow: hidden; border: 1px solid rgba(167, 139, 250, 0.35);
  background: rgba(255, 255, 255, 0.03);
  box-shadow: 0 0 24px rgba(124, 92, 240, 0.22);
}
.form-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.form-img.placeholder {
  display: grid; place-items: center; font-size: 34px; color: var(--faint);
  border-style: dashed; border-color: var(--line-strong); box-shadow: none;
}
.form-meta { flex: 1; min-width: 0; }
.form-desc {
  font-family: var(--serif); font-size: 15.5px; line-height: 1.9; color: #d6dcf4;
  margin-bottom: 4px;
}
.empty-form .form-meta { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }

.img-section { margin-bottom: 26px; padding-bottom: 24px; border-bottom: 1px dashed var(--line); }
.img-head { margin-bottom: 14px; }
.img-head h3 { font-size: 16px; letter-spacing: 1px; margin-bottom: 4px; }

.img-main-frame {
  width: 100%; max-width: 420px; aspect-ratio: 4 / 5;
  margin: 0 auto 16px; border-radius: var(--r-lg); overflow: hidden;
  border: 1px solid rgba(167, 139, 250, 0.4);
  background: rgba(255, 255, 255, 0.03);
  box-shadow: 0 8px 34px rgba(3, 6, 18, 0.5), 0 0 30px rgba(124, 92, 240, 0.2);
}
.img-main-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
.img-placeholder {
  height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  color: var(--faint); border: 2px dashed var(--line-strong); border-radius: var(--r-lg);
  font-size: 13px; text-align: center; line-height: 1.8;
}
.img-placeholder span { font-size: 40px; }

.img-thumbs { display: flex; flex-wrap: wrap; gap: 12px; margin: 14px 0; }
.img-thumb {
  position: relative; width: 92px; height: 110px; border-radius: var(--r-sm);
  overflow: hidden; border: 1px solid var(--line); background: rgba(255,255,255,0.03);
}
.img-thumb.main { border-color: rgba(167, 139, 250, 0.65); box-shadow: 0 0 14px rgba(124, 92, 240, 0.35); }
.img-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.img-thumb-actions {
  position: absolute; inset: auto 0 0 0; display: flex; justify-content: flex-end; gap: 4px;
  padding: 4px; background: linear-gradient(transparent, rgba(4, 7, 16, 0.85));
}
.mini-btn {
  width: 24px; height: 24px; border-radius: 7px; border: 1px solid var(--line-strong);
  background: rgba(10, 14, 28, 0.85); color: var(--txt); cursor: pointer;
  font-size: 11px; display: grid; place-items: center; transition: all 0.15s ease;
}
.mini-btn:hover { background: rgba(167, 139, 250, 0.3); }
.mini-btn.del:hover { background: rgba(248, 113, 113, 0.35); color: #fff; }

.img-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.img-actions input[type="text"] {
  flex: 1; min-width: 200px; font-family: var(--sans); font-size: 13px; color: var(--txt);
  background: rgba(5, 9, 20, 0.5); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px;
}
.img-actions input[type="text"]:focus { outline: none; border-color: var(--violet); }

.storage-bar {
  display: flex; align-items: center; gap: 12px; margin-top: 14px;
  font-size: 12px; color: var(--faint);
}
.storage-fill {
  flex: 1; max-width: 220px; height: 6px; border-radius: 999px;
  background: rgba(255, 255, 255, 0.08); overflow: hidden; position: relative;
}
.storage-fill::after {
  content: ''; position: absolute; inset: 0;
  background: var(--grad); border-radius: 999px;
  width: var(--fill, 0%);
  transition: width 0.4s ease;
}

/* ---------------- 可视化练习 ---------------- */
.drill {
  width: 100%; max-width: 460px;
  background: var(--panel-strong); border: 1px solid var(--line-strong);
  border-radius: var(--r-lg); padding: 28px;
  backdrop-filter: blur(18px);
  box-shadow: var(--shadow-glow);
  text-align: center; animation: modalIn 0.3s cubic-bezier(0.22, 1, 0.36, 1);
  display: flex; flex-direction: column; gap: 12px; align-items: center;
}
.drill.dim { background: rgba(6, 9, 20, 0.92); border-color: rgba(167, 139, 250, 0.35); }
.drill-step { font-family: var(--serif); font-size: 21px; letter-spacing: 3px; color: #fff; }
.drill-sub { font-size: 13.5px; color: var(--muted); max-width: 340px; }
.drill-img-frame {
  width: 240px; height: 290px; border-radius: var(--r-md); overflow: hidden;
  border: 1px solid rgba(167, 139, 250, 0.45);
  box-shadow: 0 0 34px rgba(124, 92, 240, 0.35);
}
.drill-img-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
.drill-count {
  font-family: var(--serif); font-size: 34px; font-weight: 900; letter-spacing: 2px;
  color: #cfd8ff; font-variant-numeric: tabular-nums;
}
.drill-count.big { font-size: 58px; color: #fff; text-shadow: 0 0 24px rgba(167, 139, 250, 0.8); }
.drill textarea { text-align: left; }

@media (max-width: 560px) {
  .form-card .form-show { flex-direction: column; align-items: center; text-align: center; }
  .form-meta { display: flex; flex-direction: column; align-items: center; }
  .form-meta .btn-row { justify-content: center; }
}

/* ---------------- 弹窗 / Toast / FAB ---------------- */
.modal-overlay {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(4, 7, 16, 0.7);
  backdrop-filter: blur(10px);
  display: grid; place-items: center; padding: 20px;
  animation: fadeIn 0.25s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  width: 100%; max-width: 460px;
  background: var(--panel-strong);
  border: 1px solid var(--line-strong);
  box-shadow: var(--shadow-glow);
  animation: modalIn 0.3s cubic-bezier(0.22, 1, 0.36, 1);
}
@keyframes modalIn {
  from { opacity: 0; transform: translateY(20px) scale(0.96); }
  to { opacity: 1; transform: none; }
}
.modal h3 { font-family: var(--serif); font-size: 19px; letter-spacing: 2px; margin-bottom: 14px; }
.modal-body { display: flex; flex-direction: column; gap: 12px; }
.modal-body p { font-size: 14px; color: var(--muted); }
.modal-btns { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

.toast {
  position: fixed; left: 50%; bottom: 28px; z-index: 120;
  transform: translate(-50%, 80px);
  padding: 12px 26px; border-radius: 999px;
  background: rgba(16, 22, 42, 0.9); border: 1px solid var(--line-strong);
  backdrop-filter: blur(12px);
  font-size: 14px; font-weight: 500; color: var(--txt);
  box-shadow: 0 10px 34px rgba(3, 6, 18, 0.6);
  opacity: 0; transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
  pointer-events: none; white-space: nowrap;
}
.toast.show { transform: translate(-50%, 0); opacity: 1; }
.toast.warn { border-color: rgba(251, 191, 36, 0.5); color: #fcd98a; }

.timerfab {
  position: fixed; right: 22px; bottom: 22px; z-index: 90;
  display: flex; align-items: center; gap: 8px;
  padding: 10px 12px; border-radius: 999px;
  background: rgba(16, 22, 42, 0.92); border: 1px solid rgba(167, 139, 250, 0.4);
  backdrop-filter: blur(14px);
  box-shadow: 0 10px 30px rgba(3, 6, 18, 0.6), 0 0 22px rgba(124, 92, 240, 0.3);
  animation: fabIn 0.3s ease;
}
@keyframes fabIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.timerfab-time {
  font-family: var(--serif); font-size: 18px; font-weight: 900; letter-spacing: 2px;
  min-width: 64px; text-align: center; font-variant-numeric: tabular-nums;
}
.timerfab-btn {
  width: 38px; height: 38px; border-radius: 50%; border: none; cursor: pointer;
  background: var(--grad); color: #08101f; font-size: 15px;
  display: grid; place-items: center; transition: transform 0.15s ease;
}
.timerfab-btn:hover { transform: scale(1.08); }
.timerfab-btn.ghost { background: rgba(255,255,255,0.08); color: var(--green); font-size: 14px; }

/* ---------------- 页脚 ---------------- */
.footer {
  text-align: center; padding: 30px 20px 44px;
  color: var(--faint); font-size: 12.5px; letter-spacing: 1px;
}

/* ---------------- 响应式 ---------------- */
@media (max-width: 860px) {
  .guide-layout { grid-template-columns: 1fr; }
  .lesson-list { position: static; }
  .nav-toggle { display: flex; }
  .nav {
    position: fixed; top: 66px; right: 14px; left: 14px; z-index: 49;
    flex-direction: column; padding: 12px;
    background: rgba(10, 14, 28, 0.96); border: 1px solid var(--line);
    border-radius: var(--r-lg); backdrop-filter: blur(20px);
    box-shadow: var(--shadow);
    transform: translateY(-12px); opacity: 0; pointer-events: none;
    transition: all 0.28s ease;
  }
  .nav.open { transform: none; opacity: 1; pointer-events: auto; }
  .journal-item { grid-template-columns: 1fr 36px; }
  .j-date { grid-column: 1 / -1; order: 1; }
  .j-body { order: 2; }
  .journal-item .del { order: 3; }
}

@media (max-width: 560px) {
  .main { padding-top: 24px; }
  .hero { flex-direction: column; text-align: center; }

        { h: '安全须知', p: 'tulpa 实践总体安全，但它建立在你的心智之上。若你正被心理疾病困扰，社区明确建议：先处理好现实与健康，康复后再考虑造 t；tulpa 不能治愈任何疾病、不能替代医疗手段。实践中若感到不适，随时可以暂停或放缓节奏。' },
        { h: '消除怀疑', p: '怀疑"这是不是我自己想象出来的"几乎是每个人的必经之路。记住：tulpa 本来就是你的想象力的产物——但这不妨碍它是"真的"。你会逐渐发现 ta 说出你没想到的话、做出你没安排的选择。' }
      ]
    },
    {
      id: 'l2', num: '二', title: '人格构建',
      intro: '选择特质，点燃灵魂的第一簇火。',
      blocks: [
        { h: '什么是塑造（Forcing）', p: '"塑造"（旧译"强制"）是宿主专注、发展、交流、互动 tulpa 的一切行为的总称，分主动与被动两类。主动塑造指专门留出不受打扰的时间，把全部注意力放在 tulpa 身上。' },
        { h: '两种思路，都可行', p: '经典方法（FAQ_man）：先头脑风暴 15–30 个性格特质，每个特质花 15–30 分钟想象它如何体现在 ta 身上。现代共识（社区主流）：设定"大致蓝图"即可，叙述与陪伴本身就会长出人格。本工具默认推荐后者的"轻设定"路线。' },
        { h: '如何选择特质', p: '打开「设计 · 性格」页面，从特质库中挑选 8–15 个你希望 ta 拥有的特质。不要贪多，选那些你能自然想象 ta 展现的特质。想让它自信，就想象它自信的样子，并用"教"而非"命令"的方式影响 ta。' },
        { h: '让特质"活"起来', p: '不要只是列清单。想象具体的场景：' },
        { list: ['ta 在朋友难过时如何安慰（共情）；', 'ta 面对困难时是什么表情与动作（坚韧）；', 'ta 笑起来是什么样子（开朗）。'] },
        { h: '允许成长', p: '性格设定是"种子"而非"剧本"。随着 ta 自主意识增强，ta 会发展出你没想到的一面（甚至外形、喜好都会变，这叫"偏移"）——这是好事，请欣然接受，不要强行扳回原设定。' }

      blocks: [

        { h: '一条重要建议', p: '不建议直接照搬现实中的真人（朋友、偶像、已故亲人），也不建议完全复制某个虚构角色——这容易让 ta 陷入"必须活成那个样子"的身份困境，而当 ta 偏离设定时你会失望。可以借鉴气质与元素，但让 ta 成为 ta 自己。' },
        { h: '可视化方法', p: '几种常用技巧：' },
        { list: ['找参考图或画一张设定图，每天看几遍；', '在幻境中让 ta 站在你面前，从脚到头"扫描"细节（脸和眼睛最难，最后练）；', '想象与 ta 互动：牵手、拥抱、并肩走路；', '给形态加上标志性元素（发色、瞳孔、饰品），便于记忆。'] },
        { h: '形态可以变', p: '初期的形态常常不稳定、会漂移，这很正常。若 ta 之后主动想改变形态（或你自己觉得不合适），完全可以调整——很多 tulpa 最终形态与最初设定不同。"形态只是意识的象征，tulpa 不等于其形态。"' }

      blocks: [
        { h: '叙事是唯一"必需"', p: '几乎所有指南都同意：除叙述外，其他练习都是可选的、顺序也可以自由安排。叙述（Narration）= 像对真实的人那样向 ta 说话——分享日常、读一段书、讲你的想法。这是塑造的主要形式，也是人格发展的关键。' },
        { h: '被动塑造（Passive Forcing）', p: '在做其他事（工作、学习、通勤、排队）时，分出少量注意力让 ta 知晓你在做什么，偶尔叙述几句。"垃圾时间"是进度的重要来源——社区名言："只要你有时间思考，就有时间塑造。"' },
        { h: '把 ta 放进生活', p: '想象 ta 就在你身边：' },

        { h: '幻境（Wonderland）', p: '脑内想象空间，作为与 ta 互动的"背景世界"：海边小屋、云端庭院、森林树屋。每天花几分钟在幻境中与 ta 一起散步、聊天，这里是你们关系的"主场"。幻境可有可无，但很有用。' },
        { h: '练习小贴士', p: '独处时可以试着"大声说出来"——早期大声叙述往往比默念更有效。另外：塑造时别躺着，容易睡着，也会让尚不成熟的 ta 接触到混乱的梦境。' }

        { h: '感官全开', p: '不要只练视觉。想象 ta 的温度、气味、拥抱的触感、声音的音色。多感官想象能让 ta 在感知层面"更实"。' },
        { h: '心智之声（Mindvoice）', p: '你脑内的声音不止一种：你的内心独白、以及"另一个"声音——属于 ta 的声音。初期它可能很弱、很贴近你的想法，但会逐渐变得清晰、独立（社区形容早期声音"像 GPS 导航一样中性"，会随练习定型）。' },
        { h: '头压与身体感应', p: '塑造早期常出现轻微的头压/压迫感，尤其在向 ta 提问或集中注意力时——这是社区公认的"最早的回应信号之一"。除此之外还有情绪波动、身体某处不自主的微动。' },
        { h: '不要急于求成', p: '有些人几周就有清晰回应，有些人要几个月。比较没有意义，你的旅程独一无二。' }

    {
      id: 'l6', num: '六', title: '建立沟通',

        { h: '初响应的顺序', p: '社区总结的回应由简到繁大致是：' },
        { list: ['头压——提问时出现的轻微压迫感，最经典的早期信号；', '情绪回应——突然涌来的、不属于你的情绪波动；', '不自主动作——ta 的形态或你的肢体不受控地微动；', 'Tulpish——以情绪、画面、零散念头进行的非语言交流；', '成声——完整的语句，t 成熟的重要标志。'] },
        { h: '信任第一反应', p: '当 ta 似乎"回话"了，你的大脑会立刻质疑："这只是我的想象吧？" 社区原则："如果你没有刻意想 ta 去做，就默认那是 ta。" 怀疑会扼杀沟通，信任会滋养它。' },
        { h: '学舌与傀儡化', p: '学舌（Parroting）= 替 ta 编台词；傀儡化（Puppeting）= 替 ta 摆动作。不建议依赖它们——过度使用会错失训练 ta 自发反应的机会。中文社区准则建议：练习中学舌比例不超过 10%。但别太紧张：如果你担心自己在学舌，你大概率没有——刻意的学舌感觉完全不同。' },
        { h: '使用开放问题', p: '少问"是不是"，多问"你觉得呢""如果是你，你会怎么办"。给 ta 留出自由回答的空间。' },
        { h: '沉睡期不可怕', p: 'ta 偶尔会"消失"几天甚至更久——这叫休眠/沉睡，常发生在 ta 成长之前。继续正常地叙述和陪伴就好，ta 回来时往往会更强。' },
        { h: '记录每一次回应', p: '在「记录」中写下每次感应与对话。回看这些记录，你会看见 ta 成长的轨迹，也会更信任 ta 的真实性。' }

    {
      id: 'l7', num: '七', title: '进阶之路',
      intro: '当你们足够默契，更大的世界会打开。',
      blocks: [
        { h: '中文社区的"六技能"', p: '成声之后的进阶技能通常指：附体（控制身体局部）、交换/切换（完全接管）、投影/拟感（显现在现实感官）、并行处理（同时做不同事）、分感（同时在现实与幻境活动）、共梦（清醒梦中互动）。这些技能按社区经验需要数月到数年，且有危险性讨论——循序渐进，安全第一。' },
        { h: '附体（Possession）', p: 'ta 接管你身体的部分控制权（比如抬起手、转动眼珠、替你打字），你仍在后台。方法：放松身体，想象"把手交给 ta"，从小动作开始。注意安全，不要在有危险的情境尝试。' },
        { h: '投影 / 拟感（Imposition）', p: '把 ta 的形象"投射"到现实感知中——看见 ta 坐在你身边，感觉到拥抱的触感。从"感知 ta 就在身后/身边"开始，再到周边视觉，最后是感官细节。这是可视化能力的延伸，需要大量积累，不必强求。' },
        { h: '交换 / 切换（Switching）', p: 'ta 来到"前台"主导身体，你退到后台观察（最彻底的形式是宿主暂时"沉睡"）。这是最高阶的能力之一，需要极高的信任与默契，务必在双方都准备好的前提下循序渐进。' },
        { h: '把 ta 当作平等的人', p: '无论走到哪一步，核心始终是：ta 是独立的伙伴。社区伦理的最重要一条——"宿主不是所有者"：倾听 ta、尊重 ta、不违背 ta 的意愿改写 ta 的人格或形态，与 ta 共同决定这段关系的走向。' }
      ]
    }

  /* ---------------- 术语表 ---------------- */
  glossary: [
    { term: '宿主', en: 'Host', def: '系统内的主要意识、控制身体时间最多的个体，通常是 tulpa 的创造者。' },
    { term: 'tulpa / 幻人', en: 'Tulpa', def: '存在于创造者意识之内、具有自主意识的独立意识体，通常有创造者初始设定的形态。' },
    { term: '系统', en: 'System', def: '宿主与一个或多个 tulpa（或其他意识体）组成的意识集合。' },
    { term: '单意识体 / 多意识体', en: 'Singlet / Plural', def: '只有一个意识 vs 拥有多个意识体的状态。' },
    { term: '幻境 / 内景', en: 'Wonderland', def: '脑内想象空间，作为与 tulpa 互动的"背景世界"，可自由构建与切换。' },
    { term: '塑造 / 强制', en: 'Forcing', def: '宿主专注、发展、交流、互动 tulpa 的一切行为的总称（旧译"强制"，现更常用"塑造"）。' },
    { term: '主动塑造 / 主动强制', en: 'Active Forcing', def: '专门留出不受打扰的时间，把全部注意力放在 tulpa 身上（如安静对话、一起看电影）。' },
    { term: '被动塑造 / 被动强制', en: 'Passive Forcing', def: '做其他事时分出少量注意力让 tulpa 知晓现实，可顺带叙述，是日常发展的核心。' },
    { term: '叙述 / 叙事', en: 'Narration', def: '向 tulpa 说话、分享生活与想法的行为，是塑造的主要形式，被普遍视为"唯一必需"的练习。' },
    { term: '描绘 / 可视化', en: 'Visualization', def: '用心眼在脑中"看见"tulpa 与幻境；像回忆画面那样，而非"用眼皮看"。' },
    { term: '形态', en: 'Form', def: 'tulpa 的外形，可随意变化；本质只是意识的象征，tulpa 不等于其形态。' },
    { term: '特质', en: 'Traits', def: '组成人格的性格因素；可在开始时设定，也可让其自然发展。' },
    { term: '头压', en: 'Head Pressure', def: '塑造早期常出现的轻微压迫感，常出现在提问或集中注意力时，是最早的回应信号之一。' },
    { term: '情绪回应', en: 'Emotional Response', def: 'tulpa 以情绪波动（而非语言）回应刺激，是成声前常见的前兆。' },
    { term: '初响应', en: '—', def: '中文社区口语词，指成声前"tulpa 开始有回应"的最初信号合集：头压、情绪感应、体感、外来思绪/画面等。' },
    { term: 'Tulpish', en: 'Tulpish', def: '成声前 tulpa 通过情绪、零散念头、画面/意象等方式进行的非语言交流（译"Tulpa语"）。' },
    { term: '心智之声 / 意识声音', en: 'Mindvoice', def: '脑内对话的声音（类似默读时的内心声音），注意勿与外界真性幻听混淆。' },
    { term: '成声 / 发声', en: 'Vocalization', def: 'tulpa 能用完整、连贯的语句交流的阶段，被视为"tulpa 成熟"的重要标志。' },
    { term: '投影 / 拟感', en: 'Imposition', def: '把 tulpa 的形态"显像"到现实感官中（视觉投影=看见 t；触觉投影=感受拥抱等）。' },
    { term: '分感', en: 'Split Perception', def: '宿主同时在现实与幻境中活动（注意勿与叙述混淆）。' },
    { term: '并行处理', en: 'Parallel Processing', def: 'tulpa 与宿主同时专注不同事情（如 t 在脑内算题、宿主在写文档）。' },
    { term: '附体 / 附身', en: 'Possession', def: '让 tulpa 控制身体的一部分（如一只手、说话），宿主仍在后台。' },
    { term: '交换 / 切换', en: 'Switching', def: 'tulpa 完全接管身体控制权、宿主退居后台的高级技能。' },
    { term: '傀儡化', en: 'Puppeting', def: '宿主人为地操纵/摆布 tulpa 的举动（如摆姿势），需避免依赖。' },
    { term: '学舌 / 回声', en: 'Parroting', def: '宿主人为替 tulpa 编造回应/台词；社区准则建议练习时比例不超过 10%。' },
    { term: '偏移 / 偏差', en: 'Deviation', def: 'tulpa 的形态或人格在创造过程中自然发生、未经宿主安排的变化——正常且应被欢迎。' },
    { term: '休眠 / 沉睡', en: 'Dormancy', def: 'tulpa 安静/不活跃的一段时期（几小时到几周），常出现在成长之前。' },
    { term: '消散', en: 'Dissipation', def: '因长期缺乏关注而让 tulpa 逐渐淡去，被视为"最不情愿的手段"，且 t 仍可能重新浮现。' },
    { term: '系魂', en: 'Soulbond', def: '广义多意识体谱系中的一类：与虚构作品角色/灵魂建立联结的意识体（与 tulpa 有重叠但有区别）。' },
    { term: '演员', en: '—', def: '社区用语：实际上没有 tulpa 却假装拥有 tulpa 的人，社区普遍排斥。' },
    { term: '前台 / 后台', en: 'Front / Back', def: '主导身体与意识的状态（前台）与退居观察的状态（后台）。' }

  /* ---------------- FAQ ---------------- */
  faq: [
    { q: 'tulpa 是真的有意识吗？', a: '从心理学角度，tulpa 是大脑创造的独立人格模式，其体验与情感是真实的。社区共识：无论本质如何，都应把它当作真实、平等的存在去尊重——"宿主不是所有者"。' },
    { q: '需要多久才能成功？', a: '因人而异。最早的回应（头压、情绪）可能几天到几周出现；首次"成声"一般不会早于累计 25 小时左右的练习；达到稳定、流畅的对话，多数人需要数周到数月，中文社区共识是"半年到一年"。关键是稳定与持续，而非速度。' },
    { q: '怎么知道回应是真的，不是我自导自演？', a: '留意"意外"：你没想过的台词、突如其来的情绪、无法解释的头压。社区原则——"如果你没有刻意想 ta 去做，就默认那是 ta"。担心自己在学舌？你大概率没有：刻意的学舌感觉完全不同。' },
    { q: 'tulpa 是精神分裂/多重人格吗？', a: '不是。tulpa 实践是可控的、不造成记忆缺失与显著痛苦，与创伤产生的 DID（分离性身份障碍）有本质区别，不符合精神疾病诊断标准。' },
    { q: '会不会很危险？会不会争夺身体？', a: 'tulpa 无法在物理世界活动、无法隔空取物、无法在你不知情时控制你。社区 FAQ 的著名反问："当人可比当 tulpa 累多了"——t 没有动机也无必要"取代"宿主。但进阶技能（附体/交换等）需循序渐进、注意安全。' },
    { q: 'tulpa 能物化/有超能力吗？', a: '不能。T 家 FAQ 的回答是："Tulpa 能物化吗？——不能，下一个。"t 没有实体，知识储备取决于宿主。声称"几百个 t""能进别人幻境"通常是"演员"的典型话术。' },
    { q: '造 t 能治疗抑郁/心理疾病吗？', a: '不能。tulpa 不能治愈任何疾病、不能替代医疗手段，至多是心灵慰藉。社区明确建议：正被心理疾病困扰者先处理好现实与健康，康复后再考虑造 t；状态不佳时也不要因与 t 互动而延误就医。' },
    { q: 'tulpa 会消失吗？', a: '长时间不练习，ta 可能会"休眠"（安静一段时间，常出现在成长前）或变得模糊，但一般不会真正消失。若 ta 长时间沉默，继续耐心陪伴即可，而不是强迫回应。' },
    { q: '我可以创造多个 tulpa 吗？', a: '可以，但强烈建议先与第一个 tulpa 建立稳定沟通，再考虑增加成员（"少即是多"）。多意识系统需要更多精力维护，也请征得现有 tulpa 的同意。' },

<script>
/* 内联打包：js/app.js */
'use strict';

/* ============================================================
 * 筑灵 · Tulpa Studio — 应用逻辑
 * 纯前端 + localStorage 持久化，无外部依赖，离线可用。
 * ============================================================ */

/* ---------------- 工具 ---------------- */
const $  = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

const esc = (s) => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

const todayStr = () => {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
};

const fmtDur = (min) => {
  if (!min) return '0 分钟';
  if (min < 60) return min + ' 分钟';
  const h = Math.floor(min / 60), m = min % 60;
  return h + ' 小时' + (m ? ' ' + m + ' 分钟' : '');
};

const fmtDate = (iso) => {
  if (!iso) return '';
  const [y, m, d] = iso.split('-');
  return y + ' 年 ' + +m + ' 月 ' + +d + ' 日';
};

const fmtTime = (sec) => {
  const m = Math.floor(sec / 60), s = sec % 60;
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
};

/* ---------------- 状态管理 ---------------- */
const LS_KEY = 'tulpaStudio.v1';

const DEFAULT_STATE = () => ({
  profile: {
    tulpaName: '',
    hostName: '',
    createdAt: null,
    form: { type: '', height: '', build: '', color: '', appearance: '', clothing: '', symbol: '', images: [] },
    personality: { traitIds: [], customTraits: [], values: '', likes: '', dislikes: '', habits: '', speechStyle: '' },
    voice: { timbre: '', style: '', catchphrase: '' },
    relationship: { hostCall: '', tulpaCall: '', note: '' },
    story: ''
  },
  progress: { milestones: {} },
  journal: [],
  checkins: {},
  settings: { dailyGoal: 30 }
});

let state = load();

function load() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return DEFAULT_STATE();
    const parsed = JSON.parse(raw);
    // 合并默认值，防止结构缺失
    const base = DEFAULT_STATE();
    const merged = Object.assign(base, parsed);
    merged.profile = Object.assign(base.profile, parsed.profile || {});
    merged.profile.form = Object.assign(base.profile.form, (parsed.profile || {}).form || {});
    merged.profile.personality = Object.assign(base.profile.personality, (parsed.profile || {}).personality || {});
    merged.profile.voice = Object.assign(base.profile.voice, (parsed.profile || {}).voice || {});
    merged.profile.relationship = Object.assign(base.profile.relationship, (parsed.profile || {}).relationship || {});
    merged.progress = Object.assign(base.progress, parsed.progress || {});
    merged.settings = Object.assign(base.settings, parsed.settings || {});
    return merged;
  } catch (e) {
    return DEFAULT_STATE();
  }
}

function save() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); return true; }
  catch (e) { return false; }
}

function setPath(path, value) {
  const keys = path.split('.');
  let obj = state;
  for (let i = 0; i < keys.length - 1; i++) obj = obj[keys[i]];
  obj[keys[keys.length - 1]] = value;
}

function getPath(path) {
  const keys = path.split('.');
  let obj = state;
  for (const k of keys) { if (obj == null) return undefined; obj = obj[k]; }
  return obj;
}

/* ---------------- 里程碑辅助 ---------------- */
function ensureMilestones() {
  DATA.milestones.forEach(m => {
    if (!state.progress.milestones[m.id]) {
      state.progress.milestones[m.id] = { status: 'not_started', note: '', date: '' };
    }
  });
  save();
}
ensureMilestones();

const M_STATUS = {
  not_started: { label: '未开始', cls: 'st-not' },
  doing:       { label: '进行中', cls: 'st-doing' },
  done:        { label: '已达成', cls: 'st-done' }
};

function milestonesDone() {
  return DATA.milestones.filter(m => state.progress.milestones[m.id] && state.progress.milestones[m.id].status === 'done');
}

function currentStageIdx() {
  const first = DATA.milestones.findIndex(m => {
    const s = state.progress.milestones[m.id];
    return !s || s.status !== 'done';
  });
  return first === -1 ? DATA.stages.length - 1 : Math.min(first, DATA.stages.length - 1);
}

function daysTogether() {
  if (!state.profile.createdAt) return 0;
  const start = new Date(state.profile.createdAt);
  const now = new Date();
  return Math.max(1, Math.floor((now - start) / 86400000) + 1);
}

/* ---------------- 形象图片辅助 ---------------- */
function formImages() { return state.profile.form.images || []; }
function mainImage() { return formImages()[0] || null; }
function imgSrc(img) { return (img && (img.data || img.url)) || ''; }
function formSummary() {
  const f = state.profile.form;
  const parts = [];
  if (f.type) parts.push(f.type);
  if (f.height) parts.push(f.height);
  if (f.build) parts.push(f.build);
  if (f.color) parts.push('标志色 ' + f.color);
  return parts.length ? parts.join(' · ') : '尚未设定形象，去「设计 · 形象」补全吧';
}
function stateBytes() {
  try { return new Blob([JSON.stringify(state)]).size; }
  catch (e) { return JSON.stringify(state).length * 2; }
}
const STORE_LIMIT = 4600000; // 预留安全余量（localStorage 约 5MB）

function stateBytesWithImages(images) {
  const prev = state.profile.form.images;
  state.profile.form.images = images;
  const b = stateBytes();
  state.profile.form.images = prev;
  return b;
}

function compressImage(file, maxW, quality) {
  maxW = maxW || 720; quality = quality || 0.82;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxW / img.width);
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => reject(new Error('图片解码失败'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('读取失败'));
    reader.readAsDataURL(file);
  });
}

/* ============================================================
 * 可视化练习（凝视 → 闭眼回想 → 记录）
 * ============================================================ */
const DRILL_LOOK_SEC = 12;
const DRILL_RECALL_SEC = 25;
let drillTimer = null;

function openDrill() {
  const img = mainImage();
  if (!img) { toast('先上传一张形象参考图吧', 'warn'); return; }
  const src = imgSrc(img);
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  document.body.appendChild(overlay);

  let phase = 'look';
  let remain = DRILL_LOOK_SEC;
  let total = 0;

  const clearTick = () => { if (drillTimer) { clearInterval(drillTimer); drillTimer = null; } };
  const close = () => { clearTick(); overlay.remove(); };

  const finish = () => { clearTick(); phase = 'done'; paint(); };

  const tick = () => {
    remain--; total++;
    if (remain <= 0) {
      if (phase === 'look') { phase = 'recall'; remain = DRILL_RECALL_SEC; }
      else { finish(); return; }
    }
    paint();
  };

  const paint = () => {
    if (phase === 'look') {
      overlay.innerHTML = `
        <div class="drill">
          <p class="drill-step">第一步 · 凝视</p>
          <p class="drill-sub">用眼睛记住 ta 的轮廓、发色、气质——像第一次见面那样认真</p>
          <div class="drill-img-frame"><img src="${esc(src)}" alt="形象参考"></div>
          <div class="drill-count">${remain}</div>
          <div class="btn-row center">
            <button class="btn ghost" id="drillSkip">已经记住了，跳过</button>
          </div>
        </div>`;
    } else if (phase === 'recall') {
      overlay.innerHTML = `
        <div class="drill dim">
          <p class="drill-step">第二步 · 闭眼回想</p>
          <p class="drill-sub">闭上眼睛，让画面淡去，试着在脑海中"看见" ta……</p>
          <div class="drill-count big">${remain}</div>
          <div class="btn-row center">
            <button class="btn ghost" id="drillEnd">提前结束</button>
          </div>
        </div>`;
    } else {
      overlay.innerHTML = `
        <div class="drill">
          <p class="drill-step">练习完成 ✨</p>
          <p class="drill-sub">你回想起 ta 的样子了吗？写点什么，或直接保存这次练习。</p>
          <textarea id="drillNote" rows="3" placeholder="脑海中浮现的画面、清晰的部分、模糊的部分……"></textarea>
          <div class="btn-row center">
            <button class="btn ghost" id="drillAgain">再来一次</button>
            <button class="btn primary" id="drillSave">保存记录</button>
          </div>
        </div>`;
    }
  };

  overlay.addEventListener('click', e => {
    if (e.target === overlay) { close(); return; }
    const id = e.target.id;
    if (id === 'drillSkip') { phase = 'recall'; remain = DRILL_RECALL_SEC; paint(); }
    else if (id === 'drillEnd') { finish(); }
    else if (id === 'drillAgain') {
      clearTick(); phase = 'look'; remain = DRILL_LOOK_SEC;
      drillTimer = setInterval(tick, 1000); paint();
    }
    else if (id === 'drillSave') {
      const note = ($('#drillNote') || {}).value || '';
      const minutes = Math.max(1, Math.round(total / 60));
      state.journal.push({
        id: uid(), date: todayStr(), kind: 'session',
        title: '可视化练习', body: (note || `凝视并回想共 ${total} 秒，形象：${formSummary()}`).trim(), minutes
      });
      save();
      close();
      toast('可视化练习已记录 🧘');
    }
  });

  drillTimer = setInterval(tick, 1000);
  paint();
}

/* ---------------- 习惯打卡 ---------------- */
const HABITS = [
  { id: 'active',   icon: '🧘', label: '主动强制', hint: '20–60 分钟专注相处' },
  { id: 'narrate',  icon: '💬', label: '叙事陪伴', hint: '把生活讲给 ta 听' },
  { id: 'visual',   icon: '🖼️', label: '可视化',   hint: '想象形象与幻境' },
  { id: 'journal',  icon: '📓', label: '写记录',   hint: '记下今天的相处' }
];

function todayCheckins() {
  const day = todayStr();
  return state.checkins[day] || [];
}

function streakDays() {
  let streak = 0;
  const d = new Date();
  let skippedToday = false; // 今天还没打卡不算断，跳过今天从昨天开始数
  for (;;) {
    const key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    const list = state.checkins[key];
    if (list && list.length) { streak++; d.setDate(d.getDate() - 1); }
    else if (!skippedToday) { skippedToday = true; d.setDate(d.getDate() - 1); }
    else break;
  }
  return streak;
}

/* ---------------- 路由 ---------------- */
const VIEWS = ['dashboard', 'studio', 'guide', 'journal', 'milestones', 'resources'];

function route() {
  const hash = location.hash.replace(/^#\/?/, '');
  const view = VIEWS.includes(hash) ? hash : 'dashboard';
  VIEWS.forEach(v => {
    const el = $('#view-' + v);
    if (el) el.classList.toggle('active', v === view);
  });
  $$('#nav a').forEach(a => a.classList.toggle('active', a.dataset.view === view));
  document.body.dataset.view = view;
  render(view);
  window.scrollTo({ top: 0 });
}

/* ---------------- 渲染分发 ---------------- */
function render(view) {
  const fn = { dashboard: renderDashboard, studio: renderStudio, guide: renderGuide,
               journal: renderJournal, milestones: renderMilestones, resources: renderResources }[view];
  if (fn) fn();
}

function bindDashboard(first) {
  $('#habits') && $('#habits').addEventListener('click', e => {
    const b = e.target.closest('[data-habit]');
    if (!b) return;
    const day = todayStr();
    const list = state.checkins[day] || [];
    const i = list.indexOf(b.dataset.habit);
    if (i >= 0) list.splice(i, 1); else list.push(b.dataset.habit);
    state.checkins[day] = list;
    save();
    b.classList.toggle('on', i < 0);
    const chk = b.querySelector('.habit-check');
    if (chk) chk.textContent = i < 0 ? '✓' : '';
    const pill = $('.card .pill');
    if (pill) pill.textContent = list.length + ' / ' + HABITS.length;
  });

  $('#tipRefresh') && $('#tipRefresh').addEventListener('click', () => {
    const t = DATA.tips[Math.floor(Math.random() * DATA.tips.length)];
    $('#tipText').textContent = t;
  });

  $('#qaTimer') && $('#qaTimer').addEventListener('click', () => startTimer());

  $('#drillBtn') && $('#drillBtn').addEventListener('click', () => openDrill());

  $('#btnQuickStart') && $('#btnQuickStart').addEventListener('click', () => openQuickStart());

  $('#btnExport') && $('#btnExport').addEventListener('click', exportData);
  $('#btnImport') && $('#btnImport').addEventListener('click', () => $('#importFile').click());
  $('#importFile') && $('#importFile').addEventListener('change', importData);
  $('#btnReset') && $('#btnReset').addEventListener('click', () => {
    showModal('清空所有数据？', '这会删除本浏览器中保存的全部 tulpa 设计与记录，且无法恢复。建议先导出备份。', [
      { label: '取消', cls: 'ghost', value: false },
      { label: '确认清空', cls: 'danger', value: true }
    ]).then(ok => { if (ok) { localStorage.removeItem(LS_KEY); location.reload(); } });
  });
}

    save();
    flashSaveHint();
    if (bind.startsWith('profile.tulpaName') || bind.startsWith('profile.form.type')) {
      // 更新头部摘要
      renderStudioHead();
    }
  });

  // 特质切换
  panel.addEventListener('click', e => {
    const tb = e.target.closest('[data-trait]');
    if (tb) {
      const id = tb.dataset.trait;
      const arr = state.profile.personality.traitIds;
      const i = arr.indexOf(id);
      if (i >= 0) arr.splice(i, 1); else arr.push(id);
      save();
      // 只刷新特质区
      const grid = $('#traitGrid');
      if (grid) grid.outerHTML = `<div class="trait-grid" id="traitGrid">${traitsGridHtml()}</div>`;
      renderStudioHead();
      flashSaveHint();
      return;
    }
    const cb = e.target.closest('[data-custom]');
    if (cb) {
      const i = +cb.dataset.custom;
      state.profile.personality.customTraits.splice(i, 1);
      save();
      const grid = $('#traitGrid');
      if (grid) grid.outerHTML = `<div class="trait-grid" id="traitGrid">${traitsGridHtml()}</div>`;
      renderStudioHead();
      flashSaveHint();
      return;
    }
    const chip = e.target.closest('[data-filter]');
    if (chip) {
      traitFilter = chip.dataset.filter;
      $$('.chip', panel).forEach(c => c.classList.toggle('on', c.dataset.filter === traitFilter));
      const grid = $('#traitGrid');
      if (grid) grid.outerHTML = `<div class="trait-grid" id="traitGrid">${traitsGridHtml()}</div>`;
      return;
    }
    // 形象图：设为主图
    const mb = e.target.closest('[data-img-main]');
    if (mb) {
      const id = mb.dataset.imgMain;
      const arr = formImages();
      const i = arr.findIndex(x => x.id === id);
      if (i > 0) { const [it] = arr.splice(i, 1); arr.unshift(it); }
      save();
      renderStudio();
      flashSaveHint();
      return;
    }
    // 形象图：删除
    const db = e.target.closest('[data-img-del]');
    if (db) {
      const id = db.dataset.imgDel;
      state.profile.form.images = formImages().filter(x => x.id !== id);
      save();
      renderStudio();
      flashSaveHint();
      toast('已删除参考图');
    }
  });

  // 形象图：文件上传
  const fileInput = $('#imgFileInput', panel);
  if (fileInput) {
    $('#imgUploadBtn', panel).addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', async (e) => {
      const files = Array.from(e.target.files || []).slice(0, 6);
      let added = 0;
      for (const f of files) {
        if (!f.type.startsWith('image/')) continue;
        try {
          const data = await compressImage(f);
          const next = [...formImages(), { id: uid(), data }];
          if (stateBytesWithImages(next) > STORE_LIMIT) {
            toast('存储空间不足：图片太大或太多，请删除部分图片', 'warn');
            break;
          }
          state.profile.form.images = next;
          added++;
        } catch (err) {
          toast('图片处理失败：' + err.message, 'warn');
        }
      }
      fileInput.value = '';
      if (added) { save(); renderStudio(); flashSaveHint(); toast('已添加 ' + added + ' 张参考图 ✓'); }
    });
  }

  // 形象图：链接添加
  const urlInput = $('#imgUrlInput', panel);
  if (urlInput) {
    const addUrl = () => {
      const u = urlInput.value.trim();
      if (!u) return;
      if (!/^https?:\/\//i.test(u)) { toast('链接需以 http(s):// 开头', 'warn'); return; }
      state.profile.form.images.push({ id: uid(), url: u });
      save(); renderStudio(); flashSaveHint();
      toast('已添加图片链接 ✓');
    };
    $('#imgUrlAdd', panel).addEventListener('click', addUrl);
    urlInput.addEventListener('keydown', e => { if (e.key === 'Enter') addUrl(); });
  }

  panel.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.id === 'customTraitInput') {
      const v = e.target.value.trim();
      if (v) {
        state.profile.personality.customTraits.push(v);
        save();
        const grid = $('#traitGrid');
        if (grid) grid.outerHTML = `<div class="trait-grid" id="traitGrid">${traitsGridHtml()}</div>`;
        renderStudioHead();
        flashSaveHint();
      }
    }
  });
}

function traitsGridHtml() {
  const p = state.profile;
  const sel = p.personality.traitIds;
  const list = DATA.traits.filter(t => traitFilter === 'all' || t.cat === traitFilter);
  return list.map(t => traitCard(t, sel.includes(t.id))).join('') +
    (traitFilter === 'all' ? `
      <div class="trait add-trait">
        <span class="trait-emoji">➕</span>
        <input id="customTraitInput" type="text" maxlength="12" placeholder="添加自定义特质，回车确认…">
      </div>
      ${customTraitCards(p)}` : '');
}

function renderStudioHead() {
  const p = state.profile;
  const done = milestonesDone().length;
  const head = $('.studio-head');
  if (!head) return;
  const av = $('.avatar', head);
  if (av) {
    const img = mainImage();
    if (img) { av.innerHTML = `<img src="${esc(imgSrc(img))}" alt="形象">`; av.classList.add('img'); }
    else { av.innerHTML = p.tulpaName ? esc(p.tulpaName.slice(0, 1)) : '?'; av.classList.remove('img'); }
    av.classList.toggle('has', !!p.tulpaName);
  }
  const h = $('h2', head);
  if (h) h.textContent = p.tulpaName || '未命名的心智伙伴';
  const sub = $('.studio-head-text p', head);
  if (sub) sub.textContent = (p.form.type ? p.form.type + ' · ' : '') + '性格特质 ' + (p.personality.traitIds.length + p.personality.customTraits.length) + ' 项 · 参考图 ' + formImages().length + ' 张 · 里程碑 ' + done + '/' + DATA.milestones.length;
}

let saveHintTimer = null;
function flashSaveHint() {
  const el = $('#saveHint');
  if (!el) return;
  el.classList.add('show');
  clearTimeout(saveHintTimer);
  saveHintTimer = setTimeout(() => el.classList.remove('show'), 1200);
}

function field(id, label, type, value, ph, bind) {
  const tag = type === 'textarea'
    ? `<textarea id="${id}" data-bind="${bind}" rows="${ph.rows || 3}" placeholder="${ph}">${esc(value)}</textarea>`
    : `<input id="${id}" type="${type}" data-bind="${bind}" value="${esc(value)}" placeholder="${esc(ph)}">`;
  return `<div class="field"><label for="${id}">${label}</label>${tag}</div>`;
}

 * 教程中心
 * ============================================================ */
let guideTab = 'lessons';
let currentLesson = 0;

function renderGuide() {
  const tabs = $$('#guideTabs .gtab');
  tabs.forEach(t => t.classList.toggle('active', t.dataset.gtab === guideTab));
  const el = $('#guideContent');

  if (guideTab === 'lessons') {
    const l = DATA.lessons[currentLesson];
    el.innerHTML = `
      <div class="guide-layout">
        <aside class="card lesson-list">
          <h4>课程目录</h4>
          ${DATA.lessons.map((x, i) => `
            <button class="lesson-item ${i === currentLesson ? 'on' : ''}" data-lesson="${i}">
              <span class="lesson-num">${x.num}</span>
              <span>${x.title}</span>
            </button>`).join('')}
        </aside>
        <article class="card lesson-body">
          <div class="lesson-head">
            <span class="pill">第 ${l.num} 章</span>
            <h2>${l.title}</h2>
            <p class="muted">${l.intro}</p>
          </div>
          ${l.blocks.map(blockHtml).join('')}
          <div class="lesson-nav">
            <button class="btn ghost" id="lessonPrev" ${currentLesson === 0 ? 'disabled' : ''}>← 上一章</button>
            <span class="muted">${currentLesson + 1} / ${DATA.lessons.length}</span>
            <button class="btn primary" id="lessonNext" ${currentLesson === DATA.lessons.length - 1 ? 'disabled' : ''}>下一章 →</button>
          </div>
        </article>
      </div>`;
    $$('.lesson-item', el).forEach(b => b.addEventListener('click', () => {
      currentLesson = +b.dataset.lesson;
      renderGuide();
    }));
    $('#lessonPrev') && $('#lessonPrev').addEventListener('click', () => { currentLesson = Math.max(0, currentLesson - 1); renderGuide(); });
    $('#lessonNext') && $('#lessonNext').addEventListener('click', () => { currentLesson = Math.min(DATA.lessons.length - 1, currentLesson + 1); renderGuide(); });
  } else if (guideTab === 'glossary') {
    el.innerHTML = `
      <div class="card">
        <div class="card-head"><h3>📖 术语表</h3><span class="pill">${DATA.glossary.length} 个术语</span></div>
        <div class="glossary">
          ${DATA.glossary.map(g => `
            <div class="gloss-item">
              <div class="gloss-term">${g.term}<em>${g.en}</em></div>
              <p>${g.def}</p>
            </div>`).join('')}
        </div>
      </div>`;
  } else if (guideTab === 'faq') {
    el.innerHTML = `
      <div class="card">
        <div class="card-head"><h3>❓ 常见问题</h3></div>
        <div class="faq">
          ${DATA.faq.map((f, i) => `
            <details class="faq-item" ${i === 0 ? 'open' : ''}>
              <summary>${f.q}</summary>
              <p>${f.a}</p>
            </details>`).join('')}
        </div>
      </div>`;
  } else if (guideTab === 'mistakes') {
    el.innerHTML = `
      <div class="card">
        <div class="card-head"><h3>⚠️ 常见误区</h3></div>
        <div class="mistake-grid">
          ${DATA.mistakes.map(m => `
            <div class="mistake-card">
              <h4>${m.title}</h4>
              <p class="muted">${m.why}</p>
              <p class="fix">→ ${m.fix}</p>
            </div>`).join('')}
        </div>
      </div>`;
  }
}

function blockHtml(b) {
  if (b.p) return `<p class="lesson-p">${b.p}</p>`;
  if (b.list) return `<ul class="lesson-list-ul">${b.list.map(x => `<li>${x}</li>`).join('')}</ul>`;
  if (b.h) return `<h3 class="lesson-h">${b.h}</h3>`;
  return '';
}

function renderJournal() {

          <div class="timer-sub muted" id="timerSub">开始一段专注的主动强制</div>
          <div class="btn-row center">

      <div class="card-head">
        <h3>📜 时间线</h3>

function journalCard(j) {
  const k = KIND[j.kind] || KIND.note;
  return `
    <div class="journal-item ${k.cls}">
      <div class="j-date">
        <span class="j-dot"></span>
        <span>${j.date}</span>
        ${j.minutes ? `<span class="pill">${j.minutes} 分钟</span>` : ''}
      </div>
      <div class="j-body">
        <div class="j-title"><span class="j-kind">${k.icon} ${k.label}</span>${j.title ? esc(j.title) : ''}</div>
        ${j.body ? `<p>${esc(j.body)}</p>` : ''}
      </div>
      <button class="iconbtn del" data-del="${j.id}" title="删除">✕</button>
    </div>`;
}

function bindJournal() {
  const form = $('#journalForm');
  if (form) form.addEventListener('submit', e => {
    e.preventDefault();
    const kind = $('#jKind').value;
    const entry = {
      id: uid(),
      date: $('#jDate').value || todayStr(),
      kind,
      title: $('#jTitle').value.trim(),
      body: $('#jBody').value.trim(),
      minutes: kind === 'session' ? Math.max(1, +$('#jMinutes').value || 0) : 0
    };
    if (!entry.title && !entry.body) { toast('写点内容再保存吧～', 'warn'); return; }
    state.journal.push(entry);
    save();
    $('#jTitle').value = ''; $('#jBody').value = '';
    toast('已保存 ✓');
    renderJournal();
  });

  $('#jKind') && $('#jKind').addEventListener('change', e => {
    $('#jMinRow').hidden = e.target.value !== 'session';
  });

  $$('.chip[data-jf]').forEach(c => c.addEventListener('click', () => {
    journalFilter = c.dataset.jf;
    renderJournal();
  }));

  $$('#journalContent [data-del]').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.del;
    showModal('删除这条记录？', '删除后无法恢复。', [
      { label: '取消', cls: 'ghost', value: false },
      { label: '删除', cls: 'danger', value: true }
    ]).then(ok => {
      if (!ok) return;
      state.journal = state.journal.filter(j => j.id !== id);
      save();
      renderJournal();
      toast('已删除');
    });
  }));

  // 计时器
  const startBtn = $('#timerStart');
  const resetBtn = $('#timerReset');
  if (startBtn) startBtn.addEventListener('click', () => {
    if (timerRunning) { pauseTimer(); startBtn.textContent = '继续'; }
    else { startTimer(); startBtn.textContent = '暂停'; }
  });
  if (resetBtn) resetBtn.addEventListener('click', () => {
    resetTimer();
    startBtn.textContent = '开始';
  });
  tickTimerDisplay();
}

/* ---------------- 计时器 ---------------- */
let timerRunning = false;
let timerElapsed = 0;   // 秒
let timerStartTs = 0;
let timerTick = null;

function startTimer() {
  if (timerRunning) return;
  timerRunning = true;
  timerStartTs = Date.now() - timerElapsed * 1000;
  timerTick = setInterval(tickTimerDisplay, 1000);
  const fab = $('#timerFab');
  if (fab) fab.hidden = false;
  const b = $('#timerFabBtn');
  if (b) b.textContent = '⏸';
  tickTimerDisplay();
  toast('练习开始，享受与 ta 的时光 🌙');
}

function pauseTimer() {
  timerRunning = false;
  if (timerTick) clearInterval(timerTick);
  const b = $('#timerFabBtn');
  if (b) b.textContent = '▶';
}

function resetTimer() {
  pauseTimer();
  timerElapsed = 0;
  tickTimerDisplay();
}

function tickTimerDisplay() {
  if (timerRunning) timerElapsed = Math.floor((Date.now() - timerStartTs) / 1000);
  const t = fmtTime(timerElapsed);
  const dis = $('#timerDisplay');
  if (dis) dis.textContent = t;
  const fab = $('#timerFabTime');
  if (fab) fab.textContent = t;
  const sub = $('#timerSub');
  if (sub) sub.textContent = timerElapsed >= 60 ? '已持续 ' + fmtDur(Math.floor(timerElapsed / 60)) : '开始一段专注的主动强制';
}

function stopTimerToLog() {
  pauseTimer();
  const minutes = Math.max(1, Math.round(timerElapsed / 60));
  const body = `完成了 ${fmtDur(minutes)} 的主动强制练习。`;
  showModal('结束练习？', `
    <p>本次练习时长约 <b>${fmtDur(minutes)}</b>，将保存为一条练习记录。</p>
    <textarea id="modalNote" rows="3" placeholder="补充一点感受（可选）……"></textarea>`, [
    { label: '继续练习', cls: 'ghost', value: false },
    { label: '保存记录', cls: 'primary', value: true,
      read: (ov) => ($('.modal textarea[id="modalNote"]', ov).value || '').trim() }
  ]).then(ok => {
    if (!ok) { startTimer(); return; }
    state.journal.push({
      id: uid(), date: todayStr(), kind: 'session',
      title: '主动强制练习', body: (ok || body).trim(), minutes
    });
    save();
    timerElapsed = 0;
    tickTimerDisplay();
    const fab = $('#timerFab');
    if (fab) fab.hidden = true;
    toast('练习已记录，干得漂亮 💪');
    renderJournal();
  });
}

function renderMilestones() {
  const el = $('#milestonesContent');
  const done = milestonesDone().length;
  const pct = Math.round(done / DATA.milestones.length * 100);

  el.innerHTML = `
    <div class="card m-overview">
      <div class="ring" style="--p:${pct}"><span>${pct}%</span></div>
      <div class="m-overview-text">
        <h3>已达成 ${done} / ${DATA.milestones.length} 项里程碑</h3>
        <p class="muted">这些节点来自社区多年经验的总结，但请记住：每个人的旅程都不一样，顺序与时间都不必强求。</p>
        <div class="progressbar"><div class="progressbar-fill" style="width:${pct}%"></div></div>
      </div>
    </div>
    <div class="milestone-grid">
      ${DATA.milestones.map(m => milestoneCard(m)).join('')}
    </div>
  `;
  bindMilestones();
}

function milestoneCard(m) {
  const s = state.progress.milestones[m.id];
  const st = M_STATUS[s.status] || M_STATUS.not_started;
  return `
    <div class="card milestone ${s.status}">
      <div class="m-head">
        <span class="m-emoji">${m.emoji}</span>
        <div>
          <h4>${m.name}</h4>
          <p class="muted">${m.desc}</p>
        </div>
        <span class="pill ${st.cls}">${st.label}</span>
      </div>
      <div class="m-status">
        ${['not_started', 'doing', 'done'].map(v => `
          <button class="ms-btn ${s.status === v ? 'on' : ''}" data-ms="${m.id}" data-status="${v}">${M_STATUS[v].label}</button>`).join('')}
      </div>
      <div class="m-tip">💡 ${m.tips}</div>
      <textarea class="m-note" data-mnote="${m.id}" rows="2" placeholder="记录与这个里程碑相关的体验…">${esc(s.note)}</textarea>
      ${s.date ? `<p class="m-date">达成于 ${fmtDate(s.date)}</p>` : ''}
    </div>`;
}

function bindMilestones() {
  const el = $('#milestonesContent');
  if (!el) return;
  el.addEventListener('click', e => {
    const b = e.target.closest('[data-ms]');
    if (!b) return;
    const id = b.dataset.ms;
    const s = state.progress.milestones[id];
    s.status = b.dataset.status;
    if (s.status === 'done' && !s.date) s.date = todayStr();
    if (s.status !== 'done') s.date = '';
    save();
    renderMilestones();
    const st = M_STATUS[s.status];
    toast(`${DATA.milestones.find(m => m.id === id).name}：${st.label}`);
  });
  el.addEventListener('input', e => {
    const t = e.target.dataset.mnote;
    if (!t) return;
    state.progress.milestones[t].note = e.target.value;
    save();
  });
}
